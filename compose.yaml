services:

  mysql:
    image: mysql:8.0

    container_name: mysql-container

    environment:
      MYSQL_ROOT_PASSWORD: ashu
      MYSQL_DATABASE: order_management

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - order-network

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-pashu"
        ]

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  order-service:
    image: ashutoshchauhan149/order-management-service:2.2

    container_name: order-management-container

    ports:
      - "4444:4444"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/order_management
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ashu

    depends_on:
      mysql:
        condition: service_healthy

    restart: on-failure

    networks:
      - order-network


volumes:
  mysql-data:


networks:
  order-network: